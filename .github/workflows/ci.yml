name: Vogue CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Contract & Privacy Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Integrity
        run: npx tsc --noEmit

      - name: Verify Compact v1.0 Smart Contract & ZK Artifacts
        run: npm run compile

      - name: Run Vitest Privacy & Enclave Suite
        run: npm test

  frontend-build:
    name: Production Frontend Build
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Frontend Assets
        run: npm run build
